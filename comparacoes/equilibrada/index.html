<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liceu — antes e depois</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FBFAF7;color:#213D38;font:16px/1.5 Arial,Helvetica,sans-serif}header,main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 16px;color:#536B63}.controls{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}label{display:flex;flex-direction:column;gap:6px;font-size:14px}select{font:inherit;min-height:44px;border:1px solid #75877D;border-radius:8px;background:white;color:#213D38;padding:8px 12px}a{color:#0A514D}a:focus-visible,select:focus-visible{outline:3px solid #A62255;outline-offset:3px}.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}figure{margin:0;text-align:center}figcaption{margin-bottom:12px;font-weight:700}img{display:block;width:100%;height:auto;max-width:100%;margin:auto;border:1px solid #D5DFD9}figure a{display:inline-block;margin-top:12px;padding:8px;min-height:44px}[hidden]{display:none!important}@media(max-width:760px){header,main{padding:16px}.screens{grid-template-columns:minmax(0,1fr)}}
</style></head>
<body><header><h1>Modernização Equilibrada</h1><p>Arquivo histórico da primeira implementação aprovada. Estas capturas não representam todos os refinamentos posteriores.</p><a href="revisao.html">Revisar todas as páginas em desktop e celular</a></header>
<main><div class="controls">
<label>Página<select id="page"><option value="inicio">Início</option><option value="artesaos">Artesãos</option><option value="produtos">Produtos</option><option value="painel">Painel do Liceu</option><option value="formulario">Cadastro do Liceu</option><option value="perfil">Perfil do artesão</option></select></label>
<label>Tela<select id="width"><option value="1440">Desktop · 1440px</option><option value="375">Celular · 375px</option></select></label>
<label>Comparação<select id="mode"><option value="both">Lado a lado</option><option value="antes">Somente antes</option><option value="depois">Somente depois</option></select></label>
</div><div class="screens" id="screens"><figure id="before"><figcaption>Antes</figcaption><img id="before-image" alt="Página antes do refinamento"><a id="before-link" target="_blank" rel="noopener">Abrir antes em tamanho original</a></figure><figure id="after"><figcaption>Depois · Equilibrada</figcaption><img id="after-image" alt="Página após o refinamento Equilibrado"><a id="after-link" target="_blank" rel="noopener">Abrir depois em tamanho original</a></figure></div>
</main><script>
const page=document.getElementById('page'),width=document.getElementById('width'),mode=document.getElementById('mode');
function render(){for(const [id,phase] of [['before','antes'],['after','depois']]){const src=phase+'-'+page.value+'-'+width.value+'.png';document.getElementById(id+'-image').src=src;document.getElementById(id+'-link').href=src;document.getElementById(id+'-image').style.width=width.value==='375'?'375px':'100%';document.getElementById(id).hidden=mode.value!=='both'&&mode.value!==phase;}document.getElementById('screens').style.gridTemplateColumns=mode.value==='both'&&innerWidth>760?'repeat(2,minmax(0,1fr))':'minmax(0,1fr)';}
for(const control of [page,width,mode])control.addEventListener('change',render);window.addEventListener('resize',render);render();
</script></body></html>
