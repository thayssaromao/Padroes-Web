<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direções visuais — Liceu</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F5F6F4;color:#213D38;font:16px/1.5 Arial,Helvetica,sans-serif}header,main{max-width:1320px;margin:auto;padding:24px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center}h1{font-size:24px;margin:0}header p{margin:0;color:#536B63;flex-basis:100%}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 24px}label{display:flex;flex-direction:column;gap:6px;font-size:14px}select,button{min-height:44px;font:inherit;border:1px solid #75877D;border-radius:8px;background:#FFF;color:#213D38;padding:8px 12px}button{align-self:end;cursor:pointer}button[aria-pressed=true]{background:#146F67;color:#FFF}a{color:#0A514D}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #A62255;outline-offset:3px}.views{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}.views.compare{grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0;text-align:center}figcaption{margin-bottom:12px;font-weight:700}img{display:block;max-width:100%;height:auto;margin:auto;background:#FFF;border:1px solid #D5DFD9}figure>a{display:block;margin-top:12px}#summary{margin-bottom:24px;color:#536B63}.notice{margin-left:auto;font-size:14px;color:#536B63}@media(max-width:700px){header,main{padding:16px}.views.compare{grid-template-columns:minmax(0,1fr)}.notice{margin-left:0}}
</style>
</head>
<body>
<header><h1>Direções visuais do Liceu</h1><span class="notice">Arquivo histórico · 23/11/2026</span><p>Estudos anteriores à aprovação. A direção Equilibrada foi aplicada e refinada posteriormente; estas capturas preservam as etapas originais.</p></header>
<main>
<div class="controls">
<label>Direção<select id="direction"><option value="atual">Atual</option><option value="conservador">Refinamento conservador</option><option value="equilibrado" selected>Modernização equilibrada</option></select></label>
<label>Página<select id="page"><option value="inicio">Início</option><option value="artesaos" selected>Artesãos</option><option value="produtos">Produtos</option><option value="painel">Painel do Liceu</option><option value="formulario">Cadastro do Liceu</option><option value="perfil">Perfil do artesão</option></select></label>
<label>Tela<select id="screen"><option value="1440">Desktop · 1440px</option><option value="375">Celular · 375px</option></select></label>
<button type="button" id="compare" aria-pressed="false">Comparar com atual</button>
</div>
<p id="summary" role="status"></p>
<div id="views" class="views">
<figure id="baseline" hidden><figcaption>Atual</figcaption><img id="original" alt="Página atual"><a id="original-link" target="_blank" rel="noopener">Abrir captura original</a></figure>
<figure><figcaption id="caption"></figcaption><img id="proposal" alt="Proposta visual"><a id="proposal-link" target="_blank" rel="noopener">Abrir captura em tamanho original</a></figure>
</div>
</main>
<script>
const direction=document.getElementById('direction'),page=document.getElementById('page'),screen=document.getElementById('screen'),compare=document.getElementById('compare');
const names={atual:'Atual',conservador:'Refinamento conservador',equilibrado:'Modernização equilibrada'};
const descriptions={atual:'Paleta e acabamento atualmente utilizados no portal.',conservador:'Cores principais preservadas, fundos mais leves, contorno tricolor suavizado e hierarquia de ações.',equilibrado:'Base neutra, turquesa profundo, bordas completas mais discretas e títulos com peso mais contido.'};
function render(){const value=direction.value,shot=value+'-'+page.value+'-'+screen.value+'.png',original='atual-'+page.value+'-'+screen.value+'.png';document.getElementById('proposal').src=shot;document.getElementById('proposal-link').href=shot;document.getElementById('caption').textContent=names[value];document.getElementById('original').src=original;document.getElementById('original-link').href=original;document.getElementById('summary').textContent=descriptions[value];const active=compare.getAttribute('aria-pressed')==='true'&&value!=='atual';document.getElementById('baseline').hidden=!active;document.getElementById('views').classList.toggle('compare',active);for(const img of document.querySelectorAll('figure img'))img.style.width=screen.value==='375'?'375px':'100%';}
for(const control of [direction,page,screen])control.addEventListener('change',render);compare.addEventListener('click',()=>{compare.setAttribute('aria-pressed',String(compare.getAttribute('aria-pressed')!=='true'));render()});render();
</script>
</body></html>
